services:
  - type: web
    name: docshelf-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build -w @cortex/api
    startCommand: node apps/api/dist/combined.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false

