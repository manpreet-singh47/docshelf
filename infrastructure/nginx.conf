upstream cortex_api { server api:4000; }
server {
 listen 80;
 root /usr/share/nginx/html;
 location /api/ { proxy_pass http://cortex_api; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_buffering off; proxy_read_timeout 130s; }
 location / { try_files $uri $uri/ /index.html; }
}
